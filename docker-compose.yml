# Full write-side stack. Override POSTGRES_PORT if 5432 is taken locally.
services:
  kafka:
    image: apache/kafka:3.8.1
    ports:
      - '9094:9094' # host access; in-network clients use kafka:9092
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 15

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tick
      POSTGRES_PASSWORD: tick
      POSTGRES_DB: tick
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tick -d tick']
      interval: 5s
      timeout: 5s
      retries: 10

  market-data:
    build: { context: ., dockerfile: services/market-data/Dockerfile }
    environment:
      KAFKA_BROKERS: kafka:9092
      MARKET_FEED: ${MARKET_FEED:-binance}
      PORT: '4002'
    depends_on:
      kafka: { condition: service_healthy }

  trading:
    build: { context: ., dockerfile: services/trading/Dockerfile }
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgresql://tick:tick@postgres:5432/tick
      PORT: '4001'
    ports:
      - '4001:4001'
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  analytics:
    build: { context: ., dockerfile: services/analytics/Dockerfile }
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgresql://tick:tick@postgres:5432/tick
      PORT: '4003'
    ports:
      - '4003:4003'
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_TRADING_URL: http://localhost:4001/api/v1
        VITE_ANALYTICS_URL: http://localhost:4003/api/v1
    ports:
      # Override WEB_PORT if 3000 is taken locally.
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - trading
      - analytics

volumes:
  pgdata:
